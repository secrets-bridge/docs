name: Deploy docs

# Versioned docs via `mike`:
#   - push to main          → deploys as `dev` (rolling alias)
#   - release tag v*.*.*    → deploys as `vMAJOR.MINOR` + aliases `latest`
#   - manual dispatch       → choose action
#
# Visitors land on `latest` by default (configured in mkdocs.yml's
# extra.version.default). The version selector in the top-right of
# every page lets them switch between `dev`, `latest`, and any
# previously-released version.
#
# All versions live as subdirectories on the gh-pages branch; the
# version selector reads `/versions.json` at runtime.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. v0.2 or dev)'
        required: true
        default: 'dev'
      alias:
        description: 'Alias to apply (typically `latest` for releases, blank for dev)'
        required: false
        default: ''

permissions:
  contents: write   # mike pushes to the gh-pages branch
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mike reads the gh-pages branch history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache mkdocs deps
        uses: actions/cache@v4
        with:
          key: mkdocs-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          path: |
            ~/.cache/pip
            .venv

      - name: Install mkdocs-material + mike
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Strict build (smoke)
        run: mkdocs build --strict --verbose

      # Decide what to deploy based on the triggering ref.
      - name: Resolve deploy version + alias
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            ALIAS="${{ inputs.alias }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Tag like v0.2.0 → major.minor track (v0.2). Patch
            # releases roll the same /v0.2/ URL. Adjust this if you
            # want immutable /v0.2.0/ URLs instead.
            FULL="${{ github.ref_name }}"
            VERSION="${FULL%.*}"      # v0.2.0 → v0.2
            ALIAS="latest"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION="dev"
            ALIAS=""
          else
            echo "::error::Unsupported trigger ref ${{ github.ref }}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "Deploying as version=$VERSION alias=$ALIAS"

      - name: Mike deploy
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          ALIAS="${{ steps.resolve.outputs.alias }}"
          if [[ -n "$ALIAS" ]]; then
            mike deploy --push --update-aliases "$VERSION" "$ALIAS"
          else
            mike deploy --push "$VERSION"
          fi

      # On the first run there's no default set; subsequent runs
      # leave the default alone (idempotent).
      - name: Ensure `latest` is the default landing version
        # Only when we actually deployed a `latest` alias (i.e. a release
        # tag, or a manual dispatch that set alias=latest). A `dev` dispatch
        # resolves alias="" and must NOT run this — `latest` doesn't exist
        # until the first tag, so `mike set-default latest` would fail and
        # break the (otherwise successful) dev redeploy.
        if: steps.resolve.outputs.alias == 'latest'
        run: mike set-default --push latest

      # SEO P0-1 (2026-05-30): until we cut the first `latest` tag, the
      # site root would otherwise serve the `dev` content without a
      # redirect — Google indexes both `/` and `/dev/...` as duplicates
      # AND the canonical inside each `dev` page conflicts with the
      # sitemap's clean URLs. Setting `dev` as the default makes `/`
      # → `/dev/` a real redirect so there's one canonical URL per
      # page. The condition above (the `latest` step) takes precedence
      # the moment we tag.
      - name: Default to `dev` while no `latest` exists
        if: github.ref == 'refs/heads/main'
        run: mike set-default --push dev
