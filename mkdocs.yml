      - Product status: overview/product-status.md
      - Architecture: overview/architecture.md
      - Teams and section heads: overview/teams-and-section-heads.md
      - Threat model & hard rules: overview/threat-model.md
      - Glossary: overview/glossary.md
  - Components:
      - components/index.md
      - Control Plane API: components/api.md
      - Agent: components/agent.md
      - Worker: components/worker.md
      - Controller (Kubernetes): components/controller.md
      - UI (SPA): components/ui.md
      - Core (shared library): components/core.md
  - Design system:
      - design/index.md
      - Brand voice: design/brand-voice.md
      - Tokens and theme: design/tokens.md
      - Logos and assets: design/assets.md
  - Operations:
      - operations/index.md
      - Running locally with docker compose: operations/docker-compose.md
      - Bootstrap & first sign-in: operations/bootstrap.md
      - Agent onboarding: operations/agent-onboarding.md
      - Authentication: operations/authentication.md
      - OIDC with Authentik: operations/oidc-authentik.md
      - Project environments: operations/project-environments.md
      - Policy templates: operations/policy-templates.md
      - Reveal sessions: operations/reveal-sessions.md
      - Cross-team requests: operations/cross-team-requests.md
      - Provider connections: operations/provider-connections.md
      - Configuration reference: operations/config.md
      - Troubleshooting: operations/troubleshooting.md
  - Reference:
      - reference/index.md
      - HTTP API endpoints: reference/api-endpoints.md
      - Providers supported: reference/providers.md
