name: Deploy docs

# Versioned docs via `mike`:
#   - push to main          → deploys as `dev` (rolling alias)
#   - release tag v*.*.*    → deploys as `vMAJOR.MINOR` + aliases `latest`
#   - manual dispatch       → choose action
#
# Visitors land on `latest` by default (configured in mkdocs.yml's
# extra.version.default). The version selector in the top-right of
# every page lets them switch between `dev`, `latest`, and any
# previously-released version.
#
# All versions live as subdirectories on the gh-pages branch; the
# version selector reads `/versions.json` at runtime.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. v0.2 or dev)'
        required: true
        default: 'dev'
      alias:
        description: 'Alias to apply (typically `latest` for releases, blank for dev)'
        required: false
        default: ''

permissions:
  contents: write   # mike pushes to the gh-pages branch
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mike reads the gh-pages branch history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache mkdocs deps
        uses: actions/cache@v4
        with:
          key: mkdocs-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          path: |
            ~/.cache/pip
            .venv

      - name: Install mkdocs-material + mike
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Strict build (smoke)
        run: mkdocs build --strict --verbose

      # Decide what to deploy based on the triggering ref.
      - name: Resolve deploy version + alias
        id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            ALIAS="${{ inputs.alias }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Tag like v0.2.0 → major.minor track (v0.2). Patch
            # releases roll the same /v0.2/ URL. Adjust this if you
            # want immutable /v0.2.0/ URLs instead.
            FULL="${{ github.ref_name }}"
            VERSION="${FULL%.*}"      # v0.2.0 → v0.2
            ALIAS="latest"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            VERSION="dev"
            ALIAS=""
          else
            echo "::error::Unsupported trigger ref ${{ github.ref }}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "Deploying as version=$VERSION alias=$ALIAS"

      - name: Mike deploy
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          ALIAS="${{ steps.resolve.outputs.alias }}"
          if [[ -n "$ALIAS" ]]; then
            mike deploy --push --update-aliases "$VERSION" "$ALIAS"
          elif [[ "$VERSION" == "dev" ]] && ! mike list 2>/dev/null | grep -qE 'v[0-9]'; then
            # No tagged release exists yet — roll the public `latest` alias
            # WITH `dev` so the site root (/latest/) always serves current
            # content instead of exposing an unstable-looking /dev/ URL.
            # A real `v*` tag later re-points `latest` at the release, after
            # which a `dev` push no longer touches `latest` (the grep sees a
            # `v*` version and takes the plain-deploy branch below).
            mike deploy --push --update-aliases dev latest
          else
            mike deploy --push "$VERSION"
          fi

      # Landing version for `/`: prefer `latest` (a release, or the
      # dev-rolling alias created above) so the root redirects to `/latest/`,
      # not `/dev/`. Falls back to `dev` only before any `latest` exists.
      # One canonical URL per page either way (SEO P0-1, 2026-05-30).
      - name: Set default landing version
        if: github.ref == 'refs/heads/main' || steps.resolve.outputs.alias == 'latest'
        run: |
          set -euo pipefail
          if mike list 2>/dev/null | grep -qw latest; then
            mike set-default --push latest
          else
            mike set-default --push dev
          fi
