name: Deploy docs

# Versioned docs via `mike`:
#   - push to main          → deploys as `latest` (the rolling version)
#   - release tag v*.*.*    → deploys as `vMAJOR.MINOR` + alias `latest`
#   - manual dispatch       → choose version + alias
#
# Visitors land on `latest` by default (configured in mkdocs.yml's
# extra.version.default). The version selector in the top-right of
# every page lets them switch between `latest` and any previously
# released version.
#
# All versions live as subdirectories on the gh-pages branch; the
# version selector reads `/versions.json` at runtime.
#
# Hardening:
#   - every action is pinned to a full commit SHA (the comment is the tag)
#   - dependencies install from the hash-pinned requirements.txt only
#   - untrusted values (dispatch inputs, ref names) reach the shell
#     through `env:`, never through `${{ }}` inside `run:`, and the
#     version + alias are checked against a strict pattern

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy: `latest`, `dev` or `vMAJOR.MINOR` (e.g. v0.2)'
        required: true
        default: 'dev'
      alias:
        description: 'Alias to apply (typically `latest` for releases, blank otherwise)'
        required: false
        default: ''

permissions: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    permissions:
      contents: write   # mike pushes to the gh-pages branch; nothing else is needed
    steps:
      # The token stays in .git/config on purpose: `mike deploy --push`
      # and `mike set-default --push` push gh-pages with it. This is the
      # only checkout in the workflow.
      - name: Checkout (with full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # mike reads the gh-pages branch history
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # requirements.txt is a full lock with hashes (generated from
      # requirements.in), so pip refuses any file whose hash differs and
      # installs wheels only. No actions/cache here: this job publishes
      # the site, so it doesn't restore anything another run could have
      # written (zizmor cache-poisoning).
      - name: Install mkdocs-material + mike
        run: |
          pip install --require-hashes --only-binary ':all:' -r requirements.txt

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Strict build (smoke)
        run: mkdocs build --strict --verbose

      # Decide what to deploy based on the triggering ref.
      - name: Resolve deploy version + alias
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ALIAS: ${{ inputs.alias }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            ALIAS="$INPUT_ALIAS"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Refusing to deploy: release tag must be vMAJOR.MINOR.PATCH"
              exit 1
            fi
            # Tag like v0.2.0 → major.minor track (v0.2). Patch
            # releases roll the same /v0.2/ URL. Adjust this if you
            # want immutable /v0.2.0/ URLs instead.
            VERSION="${REF_NAME%.*}"      # v0.2.0 → v0.2
            ALIAS="latest"
          elif [[ "$REF" == "refs/heads/main" ]]; then
            # Pre-release: the public rolling version IS `latest`, so the
            # canonical URLs, OG tags, and version chip all read `latest`
            # (never `dev`). A real v* tag later publishes a pinned version
            # and moves `latest` onto it.
            VERSION="latest"
            ALIAS=""
          else
            echo "::error::Unsupported trigger ref"
            exit 1
          fi
          # Strict allow-list. Anything else (a pre-release tag such as
          # v0.2.0-rc.1, shell metacharacters in a tag or input) stops here.
          if [[ ! "$VERSION" =~ ^(latest|dev|v[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Refusing to deploy: version must be latest, dev or vMAJOR.MINOR"
            exit 1
          fi
          if [[ ! "$ALIAS" =~ ^([a-z][a-z0-9-]{0,31})?$ ]]; then
            echo "::error::Refusing to deploy: alias must be empty or match [a-z][a-z0-9-]{0,31}"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "Deploying as version=$VERSION alias=$ALIAS"

      - name: Mike deploy
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          ALIAS: ${{ steps.resolve.outputs.alias }}
        run: |
          set -euo pipefail
          # Migration: retire a stale `dev` version (the pre-release rolling
          # version was renamed dev → latest) so /dev/ never appears in the
          # public version selector, canonical URLs, or OG tags.
          if mike list 2>/dev/null | grep -qw dev; then
            mike delete --push dev
          fi
          if [[ -n "$ALIAS" ]]; then
            # A real release: deploy the pinned VERSION and move `latest`
            # onto it. If `latest` currently exists as a VERSION (the
            # pre-release rolling one), retire it first so it can become an
            # alias of the release.
            if [[ "$ALIAS" == "latest" ]] && mike list --json 2>/dev/null \
                 | python3 -c "import sys,json; sys.exit(0 if any(v.get('version')=='latest' for v in json.load(sys.stdin)) else 1)"; then
              mike delete --push latest
            fi
            mike deploy --push --update-aliases "$VERSION" "$ALIAS"
          else
            mike deploy --push "$VERSION"
          fi

      # Landing version for `/`: always `latest` (the rolling pre-release
      # version, or the alias a release moved onto its pinned version) — so
      # `/` redirects to `/latest/` and there's one canonical URL per page
      # (SEO P0-1, 2026-05-30).
      - name: Set default landing version
        if: github.ref == 'refs/heads/main' || steps.resolve.outputs.alias == 'latest'
        run: mike set-default --push latest

      # Everything at the root of gh-pages that mike doesn't own:
      # robots.txt (from site-root/), the sitemap index, llms.txt and
      # llms-full.txt, the 404 page, and redirects for the URLs the site
      # had before it was versioned. See scripts/publish_root.py.
      - name: Publish root files
        if: github.ref == 'refs/heads/main' || steps.resolve.outputs.alias == 'latest'
        run: |
          set -euo pipefail
          git fetch --no-tags origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/gh-pages" origin/gh-pages
          python3 scripts/publish_root.py "$RUNNER_TEMP/gh-pages" site-root latest
          cd "$RUNNER_TEMP/gh-pages"
          git add -A
          if git diff --cached --quiet; then
            echo "Root files unchanged"
          else
            git commit -q -m "Publish root files for latest"
            git push origin HEAD:gh-pages
          fi
