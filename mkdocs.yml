site_name: Secrets Bridge
# Trailing slash matters: MkDocs uses site_url verbatim for the
# <link rel="canonical"> tag and for absolute URLs in sitemap.xml.
# Must point at the site root since we publish via `mike` and the
# deploy step (set-default --push dev) makes `/` redirect to the
# default version's URL.
site_url: https://secrets-bridge.io/
# Trimmed to <= 155 chars so Google's SERP snippet doesn't truncate
# our key terms (audit 2026-05-30 P1-4).
site_description: >-
  Unified secrets control plane for approvals, RBAC, audit, and
  least-privilege agent execution across your secrets providers.
  AWS/Vault live today; Azure/GCP roadmap.
site_author: Secrets Bridge contributors
repo_name: secrets-bridge
repo_url: https://github.com/secrets-bridge
# repo_url is the organisation, so the edit link names the docs repo itself.
edit_uri: https://github.com/secrets-bridge/docs/edit/main/docs/

copyright: >-
  Copyright &copy; 2026 Secrets Bridge contributors.
  Built by
  <a href="https://www.linkedin.com/in/haydercyber1/" rel="author" target="_blank">Haider Raed</a>.
  <a href="https://github.com/secrets-bridge/.github/blob/main/SECURITY.md">Security policy</a>.

theme:
  name: material
  language: en
  custom_dir: overrides
  favicon: assets/favicon.svg
  # The horizontal lockup (mark and wordmark), as the brand book asks;
  # brand.css hides the retyped site name next to it.
  logo: assets/logo-horizontal-color.svg
  palette:
    # Colours come from docs/stylesheets/brand.css (the console's tokens);
    # "custom" stops Material from layering its own palette on top.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light theme
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
    - search.share
    - announce.dismiss

extra:
  generator: false
  # Version selector — populated by `mike` from the gh-pages branch
  # at runtime. CI uses:
  #   - push to main         → `mike deploy --update-aliases dev`
  #   - release tag `v*.*.*` → `mike deploy --update-aliases <ver> latest`
  # The default version visitors land on is `latest`; the `dev`
  # rolling alias serves the in-progress main branch.
  version:
    provider: mike
    default: latest
  # Brand surface metadata — consumed by overrides/main.html for the
  # per-page Open Graph + Twitter card tags. Update here, not in the
  # template, when brand details change.
  brand:
    name: Secrets Bridge
    tagline: Access control for the secrets you already keep.
    # Self-hosted on the docs domain. raw.githubusercontent.com is
    # rate-limited and not cache-friendly for social crawlers (SEO
    # audit 2026-05-30 P2-7). 1200×630 PNG.
    og_image: https://secrets-bridge.io/assets/og-banner.png
    twitter_handle: ""  # set when an org Twitter account exists
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/secrets-bridge
      name: GitHub organisation
    # Images and Helm charts publish to GHCR under ghcr.io/secrets-bridge.
    - icon: fontawesome/brands/docker
      link: https://github.com/orgs/secrets-bridge/packages
      name: Container images and Helm charts (ghcr.io/secrets-bridge)

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - tags
  # Self-host third-party assets at build time so the published site
  # loads no scripts, styles or fonts from other origins. GitHub Pages
  # can't set a CSP, so this is the control we have. It downloads the
  # Google Fonts CSS + woff2 files and the Mermaid build that Material
  # lazy-loads on diagram pages, then rewrites the references to
  # assets/external/. A failed download is a warning, which fails
  # `mkdocs build --strict` instead of shipping an external reference.
  # (The header's repo widget still fetches star/fork counts as JSON
  # from api.github.com because repo_url is set.)
  - privacy:
      assets_expr_map:
        # Material's default .js pattern only matches URLs ending in
        # .js/.css/.json. The extra branch also catches the
        # ResizeObserver polyfill URL, which has no extension.
        .js: '["''](?P<url>(?:https?:)?//(?:[^"'']+\.(?:css|js(?:on)?)|unpkg\.com/resize-observer-polyfill))["'']'

extra_css:
  - stylesheets/brand.css
  - stylesheets/landing.css

